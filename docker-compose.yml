services:

  # ─────────────────────────────────────────
  # NGINX — servidor web
  # Recibe peticiones HTTP y las enruta:
  #   - ficheros estáticos → los sirve directamente
  #   - .php               → los delega a php-fpm vía FastCGI
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: contentio_nginx
    restart: unless-stopped
    ports:
      - "8080:80"        # http://localhost:8080 en tu máquina
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend
    depends_on:
      - php
    networks:
      - contentio

  # ─────────────────────────────────────────
  # PHP-FPM — ejecutor PHP para Laravel
  # Construido desde docker/php/Dockerfile
  # Se monta el código fuente del backend como volumen
  # ─────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: contentio_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
    working_dir: /var/www/backend
    depends_on:
      postgres:
        condition: service_healthy   # espera a que Postgres esté listo
    networks:
      - contentio

  # ─────────────────────────────────────────
  # POSTGRESQL 16 — base de datos
  # Los datos persisten en el volumen pgdata
  # healthcheck: garantiza que el servicio está listo antes
  # de que php intente conectarse
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: contentio_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"      # accesible desde tu máquina (ej: DBeaver) — 5433 evita conflicto con PostgreSQL nativo de Windows
    environment:
      POSTGRES_DB:               contentio
      POSTGRES_USER:             contentio
      POSTGRES_PASSWORD:         secret
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentio -d contentio"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contentio

  # ─────────────────────────────────────────
  # NODE — servidor de desarrollo Vue.js (Vite)
  # Se activa en S0-04 cuando el frontend esté inicializado
  # En producción no se usa — Nginx sirve el build estático
  # ─────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: contentio_node
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"      # http://localhost:5173 — Vue dev server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - contentio

# Red interna compartida por todos los servicios
# Permite que se comuniquen por nombre (ej: "php", "postgres")
networks:
  contentio:
    driver: bridge

# Volumen persistente para los datos de PostgreSQL
# Sin esto, los datos se pierden al hacer docker compose down
volumes:
  pgdata:
