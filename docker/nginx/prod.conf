# ─────────────────────────────────────────────────────────────────────────────
# prod.conf — Nginx produccion HTTPS
# deploy.sh reemplaza YOUR_DOMAIN por el dominio real antes de usarlo.
# ─────────────────────────────────────────────────────────────────────────────

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Permitir verificacion ACME para renovaciones SSL futuras
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://YOUR_DOMAIN$request_uri;
    }
}

# Redirigir www → sin www (HTTPS)
server {
    listen 443 ssl;
    server_name www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    return 301 https://YOUR_DOMAIN$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 500M;
    charset utf-8;

    access_log /var/log/nginx/contentio_access.log;
    error_log  /var/log/nginx/contentio_error.log;

    # Frontend Vue (archivos estaticos)
    root /var/www/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Laravel
    location /api/ {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        root /var/www/backend/public;
        try_files $uri =404;
    }

    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass         php:9000;
        fastcgi_index        index.php;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param        HTTP_AUTHORIZATION $http_authorization;
        include              fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
