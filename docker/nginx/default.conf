server {
    listen 80;
    server_name localhost;

    # Root apunta a public/ de Laravel (donde está index.php)
    root /var/www/backend/public;
    charset utf-8;
    index index.php;

    access_log /var/log/nginx/contentio_access.log;
    error_log  /var/log/nginx/contentio_error.log;

    # Laravel — todas las rutas pasan por index.php
    # try_files: busca el archivo real ($uri), si no existe lo manda a index.php
    # Esto permite que Vue Router y Laravel Routing funcionen correctamente
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI — Nginx delega la ejecución PHP a php-fpm
    # "php" es el nombre del servicio en docker-compose, resuelto por DNS interno
    # Puerto 9000: donde escucha php-fpm dentro de su contenedor
    location ~ \.php$ {
        fastcgi_pass         php:9000;
        fastcgi_index        index.php;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include              fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Bloquea acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
