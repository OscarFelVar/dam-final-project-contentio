# Configuracion inicial HTTP-only (solo para obtener el certificado SSL por primera vez)
# deploy.sh usa este archivo en el primer arranque, antes de tener el certificado.
# Una vez obtenido el cert, Nginx se recarga con prod.conf.
server {
    listen 80;
    server_name _;

    # Ruta para la verificacion ACME de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Contentio — inicializando SSL...';
        add_header Content-Type text/plain;
    }
}
