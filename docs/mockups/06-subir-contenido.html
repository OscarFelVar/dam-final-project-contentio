<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTENTIO — Subir Contenido</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'ABeeZee', sans-serif; }
    .sidebar { background: #4A342A; background-image: radial-gradient(circle at 1px 1px, rgba(250,249,246,0.04) 1px, transparent 0); background-size: 24px 24px; }
    .nav-item { transition: all 0.15s ease; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
    .nav-active { background: rgba(255,255,255,0.1); color: white; border-left: 2px solid rgba(215,201,184,0.5); }
    .type-card { transition: all 0.15s ease; cursor: pointer; }
    .type-card:hover { border-color: #7D5A44; background: #F5F1EA; }
    .type-card.selected { border-color: #4A342A; background: #F5F1EA; }
    .dropzone { transition: all 0.2s ease; }
    .dropzone:hover { border-color: #7D5A44; background: #F5F1EA; }
  </style>
</head>
<body class="bg-[#FAF9F6] text-[#4A342A]">
<div class="flex min-h-screen">

  <!-- Sidebar (dimmed behind modal) -->
  <aside class="sidebar fixed left-0 top-0 h-screen w-64 flex flex-col z-10 opacity-40 pointer-events-none">
    <div class="px-6 pt-7 pb-5">
      <img src="./logo.png" alt="CONTENTIO" class="w-44 h-auto object-contain" onerror="this.outerHTML='<span class=\'text-white tracking-[0.2em] text-base\'>CONTENTIO</span>'">
    </div>
    <div class="mx-6 border-t border-white/8 mb-5"></div>
    <nav class="flex-1 px-4 space-y-0.5">
      <p class="px-3 mb-2 text-[10px] tracking-[0.15em] text-white/30 uppercase">Principal</p>
      <a class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#D7C9B8] text-sm">
        <svg class="w-4 h-4 flex-shrink-0 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Inicio
      </a>
      <a class="nav-item nav-active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        Proyectos
      </a>
    </nav>
  </aside>

  <!-- Page behind (dimmed) -->
  <div class="ml-64 flex-1 p-10 opacity-30 pointer-events-none select-none">
    <div class="h-8 bg-[#E8E0D8] rounded w-48 mb-8"></div>
    <div class="grid grid-cols-4 gap-4 mb-8">
      <div class="h-28 bg-white border border-[#E8E0D8] rounded-xl"></div>
      <div class="h-28 bg-white border border-[#E8E0D8] rounded-xl"></div>
      <div class="h-28 bg-white border border-[#E8E0D8] rounded-xl"></div>
      <div class="h-28 bg-white border border-[#E8E0D8] rounded-xl"></div>
    </div>
    <div class="h-64 bg-white border border-[#E8E0D8] rounded-xl"></div>
  </div>

  <!-- Modal overlay -->
  <div class="fixed inset-0 z-20 flex items-center justify-center" style="background: rgba(74,52,42,0.35); backdrop-filter: blur(4px);">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden">

      <!-- Modal header -->
      <div class="px-7 py-5 border-b border-[#F0EAE2] flex items-center justify-between">
        <div>
          <h2 class="text-base text-[#4A342A] tracking-wide">Subir contenido</h2>
          <p class="text-xs text-[#A08A7A] mt-0.5">Campaña Marzo 2026</p>
        </div>
        <a href="05-detalle-proyecto.html">
          <button class="w-8 h-8 flex items-center justify-center rounded-lg text-[#D7C9B8] hover:text-[#7D5A44] hover:bg-[#F5F1EA] transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </a>
      </div>

      <!-- Modal body -->
      <div class="px-7 py-6 space-y-6">

        <!-- Type selector -->
        <div>
          <label class="block text-xs tracking-[0.1em] uppercase text-[#7D5A44] mb-3">Tipo de contenido</label>
          <div class="grid grid-cols-3 gap-3">

            <div class="type-card selected border border-[#4A342A] rounded-xl p-4 text-center">
              <div class="w-8 h-8 mx-auto mb-2 bg-[#4A342A] rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.069A1 1 0 0121 8.868V15.13a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              </div>
              <p class="text-xs text-[#4A342A]">Reel</p>
            </div>

            <div class="type-card border border-[#E8E0D8] rounded-xl p-4 text-center">
              <div class="w-8 h-8 mx-auto mb-2 bg-[#F5F1EA] rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-[#A08A7A]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              </div>
              <p class="text-xs text-[#7D5A44]">Post</p>
            </div>

            <div class="type-card border border-[#E8E0D8] rounded-xl p-4 text-center">
              <div class="w-8 h-8 mx-auto mb-2 bg-[#F5F1EA] rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-[#A08A7A]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
              </div>
              <p class="text-xs text-[#7D5A44]">Story</p>
            </div>

          </div>
        </div>

        <!-- Title -->
        <div>
          <label class="block text-xs tracking-[0.1em] uppercase text-[#7D5A44] mb-2">Título</label>
          <input type="text" placeholder="Nombre del contenido..." value="Reel Primavera #3" class="w-full border border-[#D7C9B8] rounded-lg px-4 py-2.5 text-sm text-[#4A342A] placeholder-[#D7C9B8] bg-white focus:outline-none focus:border-[#4A342A] focus:ring-2 focus:ring-[#4A342A]/8 transition-all">
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs tracking-[0.1em] uppercase text-[#7D5A44] mb-2">Descripción <span class="text-[#D7C9B8] normal-case tracking-normal">(opcional)</span></label>
          <textarea placeholder="Breve descripción del contenido..." rows="2" class="w-full border border-[#D7C9B8] rounded-lg px-4 py-2.5 text-sm text-[#4A342A] placeholder-[#D7C9B8] bg-white focus:outline-none focus:border-[#4A342A] focus:ring-2 focus:ring-[#4A342A]/8 transition-all resize-none"></textarea>
        </div>

        <!-- Drop zone -->
        <div>
          <label class="block text-xs tracking-[0.1em] uppercase text-[#7D5A44] mb-2">Archivo</label>
          <div class="dropzone border-2 border-dashed border-[#D7C9B8] rounded-xl p-8 text-center cursor-pointer">
            <div class="w-10 h-10 bg-[#F5F1EA] rounded-xl flex items-center justify-center mx-auto mb-3">
              <svg class="w-5 h-5 text-[#A08A7A]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            </div>
            <p class="text-sm text-[#7D5A44] mb-1">Arrastra tu archivo aquí</p>
            <p class="text-xs text-[#D7C9B8]">o haz clic para seleccionar</p>
            <p class="text-[10px] text-[#D7C9B8] mt-3 tracking-wide">JPG · PNG · MP4 · máx. 500 MB</p>
          </div>
        </div>

      </div>

      <!-- Modal footer -->
      <div class="px-7 py-5 bg-[#FDFCFB] border-t border-[#F0EAE2] flex items-center justify-end gap-3">
        <a href="05-detalle-proyecto.html">
          <button class="px-5 py-2.5 border border-[#E8E0D8] text-[#A08A7A] rounded-lg text-sm hover:bg-white hover:text-[#4A342A] transition-colors">
            Cancelar
          </button>
        </a>
        <button class="px-6 py-2.5 bg-[#4A342A] text-white rounded-lg text-sm hover:bg-[#7D5A44] transition-colors flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Subir contenido
        </button>
      </div>

    </div>
  </div>

</div>
</body>
</html>
