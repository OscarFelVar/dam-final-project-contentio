<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTENTIO — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'ABeeZee', sans-serif; }
    .brand-panel {
      background: #4A342A;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(250,249,246,0.04) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .input-field:focus { outline: none; border-color: #4A342A; box-shadow: 0 0 0 3px rgba(74,52,42,0.08); }
    .btn-primary:hover { background-color: #7D5A44; }
  </style>
</head>
<body class="bg-[#FAF9F6] text-[#4A342A] min-h-screen flex">

  <!-- Left panel — brand -->
  <div class="brand-panel hidden lg:flex lg:w-[48%] flex-col justify-between p-12 relative overflow-hidden">
    <!-- Top logo -->
    <img src="./logo.png" alt="CONTENTIO" class="w-44 h-auto object-contain" onerror="this.outerHTML='<span class=\'text-white text-lg tracking-[0.25em]\'>CONTENTIO</span>'">

    <!-- Center quote -->
    <div>
      <div class="w-8 h-px bg-[#D7C9B8]/40 mb-8"></div>
      <p class="text-[#D7C9B8] text-2xl leading-relaxed font-light max-w-sm">
        El espacio donde el contenido se convierte en aprobación.
      </p>
      <p class="text-[#7D5A44] text-sm mt-6 tracking-wide">Revisión · Anotación · Aprobación</p>
    </div>

    <!-- Bottom -->
    <div class="flex items-center gap-3">
      <div class="w-2 h-2 rounded-full bg-[#D7C9B8]/30"></div>
      <div class="w-2 h-2 rounded-full bg-[#D7C9B8]/60"></div>
      <div class="w-2 h-2 rounded-full bg-white/80"></div>
    </div>

    <!-- Decorative circle -->
    <div class="absolute -bottom-24 -right-24 w-72 h-72 rounded-full border border-white/5"></div>
    <div class="absolute -bottom-16 -right-16 w-48 h-48 rounded-full border border-white/5"></div>
  </div>

  <!-- Right panel — form -->
  <div class="flex-1 flex flex-col justify-center items-center px-8 sm:px-12 lg:px-16">
    <div class="w-full max-w-sm">

      <!-- Mobile logo -->
      <div class="mb-10 lg:hidden">
        <img src="./logo.png" alt="CONTENTIO" class="w-40 h-auto object-contain" onerror="this.outerHTML='<span class=\'text-[#4A342A] text-lg tracking-[0.2em]\'>CONTENTIO</span>'">
      </div>

      <!-- Heading -->
      <div class="mb-8">
        <h1 class="text-2xl text-[#4A342A] tracking-wide">Bienvenido</h1>
        <p class="text-[#A08A7A] text-sm mt-1.5">Accede a tu espacio de trabajo</p>
      </div>

      <!-- Form -->
      <form class="space-y-5">

        <div>
          <label class="block text-xs tracking-[0.1em] uppercase text-[#7D5A44] mb-2">Correo electrónico</label>
          <input
            type="email"
            placeholder="tu@agencia.com"
            value="oscar@agencia.com"
            class="input-field w-full border border-[#D7C9B8] rounded-lg px-4 py-3 text-sm text-[#4A342A] bg-white placeholder-[#D7C9B8] transition-all"
          >
        </div>

        <div>
          <label class="block text-xs tracking-[0.1em] uppercase text-[#7D5A44] mb-2">Contraseña</label>
          <div class="relative">
            <input
              type="password"
              placeholder="••••••••••"
              value="password123"
              class="input-field w-full border border-[#D7C9B8] rounded-lg px-4 py-3 text-sm text-[#4A342A] bg-white placeholder-[#D7C9B8] transition-all pr-11"
            >
            <button type="button" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#D7C9B8] hover:text-[#7D5A44] transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div class="flex justify-end">
          <a href="#" class="text-xs text-[#A08A7A] hover:text-[#7D5A44] transition-colors">¿Olvidaste tu contraseña?</a>
        </div>

        <a href="02-dashboard-agencia.html">
          <button type="submit" class="btn-primary w-full bg-[#4A342A] text-white rounded-lg py-3 text-sm tracking-[0.08em] transition-colors duration-200 mt-2">
            Iniciar sesión
          </button>
        </a>

      </form>

      <!-- Footer note -->
      <p class="text-center text-[#D7C9B8] text-xs mt-10 tracking-wide">
        Acceso solo por invitación
      </p>

    </div>

    <!-- Back to index -->
    <a href="index.html" class="absolute top-6 right-6 text-[#D7C9B8] hover:text-[#A08A7A] text-xs tracking-wide transition-colors">← Índice</a>
  </div>

</body>
</html>
