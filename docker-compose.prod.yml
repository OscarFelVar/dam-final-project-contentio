services:

  # ─────────────────────────────────────────
  # NGINX — servidor web de producción
  # Sirve: frontend estático + proxy API + SSL
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: contentio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/current.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend:ro
      - frontend_dist:/var/www/frontend/dist:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - php
    networks:
      - contentio

  # ─────────────────────────────────────────
  # PHP-FPM — Laravel API
  # ─────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: contentio_php
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend:/var/www/backend
    working_dir: /var/www/backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contentio

  # ─────────────────────────────────────────
  # POSTGRESQL — base de datos
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: contentio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contentio

  # ─────────────────────────────────────────
  # FRONTEND BUILD — compila Vue y copia dist
  # Se ejecuta una vez; Nginx sirve los archivos
  # ─────────────────────────────────────────
  frontend-build:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    volumes:
      - frontend_dist:/output
    restart: "no"   # solo corre una vez

  # ─────────────────────────────────────────
  # CERTBOT — obtener/renovar certificado SSL
  # Uso: docker compose -f docker-compose.prod.yml run --rm certbot certonly ...
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: contentio_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    restart: "no"

networks:
  contentio:
    driver: bridge

volumes:
  pgdata:
  frontend_dist:
  certbot_www:
  certbot_certs:
